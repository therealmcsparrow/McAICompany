<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>aico dashboard</title>
<style>
:root {
  --bg: #FAFAF7; --surface: #FFFFFF; --head: #eceef2; --text: #1B1F23; --muted: #4B5563;
  --accent: #1D4F91; --accent-text: #FFFFFF; --focus: #1D4F91;
  --control-border: #6b7280; --line: #C9CCD0;
  --ok: #1A6B3A; --warn: #8A5300; --err: #B3261E; --info: #1D4F91; --unknown: #5B636B;
  --warn-bg: #fff4d6; --err-bg: #fdecec; --ok-bg: #e8f5ec; --info-bg: #e9eefb;
  --fs-sm: .875rem; --fs-md: 1rem; --fs-lg: 1.25rem; --fs-xl: 1.75rem;
  --s1: .25rem; --s2: .5rem; --s3: .75rem; --s4: 1rem; --s5: 1.5rem; --s6: 2rem;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171A; --surface: #1C2024; --head: #20242c; --text: #E6E8EA; --muted: #A9B0B7;
    --accent: #8AB4F8; --accent-text: #0b0f1a; --focus: #8AB4F8;
    --control-border: #8a92a3; --line: #323843;
    --ok: #5CC38A; --warn: #E0A33A; --err: #F28B82; --info: #8AB4F8; --unknown: #A9B0B7;
    --warn-bg: #33290f; --err-bg: #3a1b1d; --ok-bg: #16301f; --info-bg: #1d2740;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: var(--fs-md)/1.5 system-ui, "Segoe UI", sans-serif; }
header, main { max-width: 120rem; margin: 0 auto; padding: 0 var(--s4); }
h1 { font-size: var(--fs-xl); line-height: 1.2; margin: var(--s5) 0 var(--s2); }
h2 { font-size: var(--fs-lg); margin: var(--s5) 0 var(--s3); }
h3 { font-size: var(--fs-md); margin: 0; padding: var(--s2) var(--s3); background: var(--head); border-top: .25rem solid var(--line); }
#col-needs-ceo { border-top-color: var(--warn); }
header p { margin: 0 0 var(--s2); color: var(--muted); }
a { color: var(--accent); }
.mono { font-family: ui-monospace, Consolas, monospace; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.skip { position: absolute; left: var(--s2); top: -4rem; background: var(--surface); color: var(--text); border: 2px solid var(--control-border); padding: var(--s3) var(--s4); min-height: 2.75rem; z-index: 2; }
.skip:focus { top: var(--s2); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
button { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--control-border); border-radius: .375rem; min-height: 2.75rem; min-width: 2.75rem; padding: var(--s2) var(--s4); cursor: pointer; }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
#paused { margin-left: var(--s2); color: var(--muted); }
#lan { display: flex; gap: var(--s2); align-items: flex-start; margin: var(--s4) 0; padding: var(--s3) var(--s4); background: var(--warn-bg); color: var(--text); border: 1px solid var(--control-border); border-radius: .375rem; }
#lan[hidden], [hidden] { display: none; }
#columns { display: grid; gap: var(--s4); grid-template-columns: 1fr; }
@media (min-width: 40rem) { #columns { grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); } }
@media (min-width: 90rem) { #columns { grid-template-columns: repeat(8, minmax(13rem, 1fr)); } }
.col { background: var(--bg); min-width: 0; }
.col ul, .roadmap ul { list-style: none; margin: 0; padding: var(--s2) 0 0; display: grid; gap: var(--s2); }
.card, .col .empty { background: var(--surface); border: 1px solid var(--control-border); border-radius: .375rem; padding: var(--s3); overflow-wrap: anywhere; }
.col .empty { color: var(--muted); }
.card:focus-within { outline: 2px solid var(--focus); outline-offset: 1px; }
.card .title { width: 100%; text-align: left; font-weight: 600; background: none; border: 0; padding: var(--s2) 0; }
.card p { margin: 0 0 var(--s1); }
.card .slug, .card .note, .muted { color: var(--muted); font-size: var(--fs-sm); }
.status { display: inline-flex; align-items: center; gap: .375rem; }
.status svg { flex: none; }
.s-ok { color: var(--ok); } .s-warn { color: var(--warn); } .s-error { color: var(--err); }
.s-info { color: var(--info); } .s-pending { color: var(--info); } .s-unknown { color: var(--unknown); } .s-skipped { color: var(--unknown); }
.status span { color: var(--text); }
.card .num { font-variant-numeric: tabular-nums; }
#status-line { margin: var(--s2) 0 0; }
#empty { padding: var(--s3) var(--s4); background: var(--surface); border: 1px solid var(--control-border); border-radius: .375rem; }
#empty h3 { background: none; border: 0; padding: 0; }
.more { margin-top: var(--s2); }
.roadmap li { overflow-wrap: anywhere; padding: var(--s1) 0; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; inset-inline-start: auto; width: min(36rem, 100vw); max-width: 100%; overflow-y: auto; overflow-wrap: anywhere; background: var(--surface); color: var(--text); border-left: 1px solid var(--control-border); padding: var(--s4); z-index: 10; }
.drawer-head { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--s3); }
.drawer-head h2 { margin: 0; }
.drawer-sec { margin: var(--s4) 0; }
.drawer-sec h3 { margin: 0 0 var(--s2); }
.drawer-error { color: var(--err); }
.drawer .close { margin-top: var(--s3); }
.drawer ul.plain, .drawer ul.links, .drawer ol.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s2); }
.drawer .did { white-space: pre-wrap; margin: var(--s1) 0 0; }
.drawer .step { padding: var(--s2) 0; border-bottom: 1px solid var(--line); }
.drawer .step-line { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); margin: 0; }
.links a { display: block; min-height: 2.75rem; padding: var(--s2) 0; }
@media (forced-colors: active) {
  .card, .status { border: 1px solid CanvasText; }
  :focus-visible { outline: 3px solid Highlight; }
}
</style>
</head>
<body>
<a class="skip" href="#board">Skip to board</a>
<header>
  <h1>aico dashboard</h1>
  <p id="summary">Counting runs...</p>
  <p id="conn">Connecting...</p>
  <p><button type="button" id="pause" aria-pressed="false">Pause updates</button><span id="paused" hidden>Paused</span></p>
</header>
<main id="board" tabindex="-1" aria-busy="true">
  <p id="lan" hidden></p>
  <h2>Board</h2>
  <div id="empty" hidden>
    <h3>No runs yet</h3>
    <p>Runs appear here when you start one with /aico:lead.</p>
  </div>
  <div id="columns"></div>
  <section class="roadmap" aria-labelledby="roadmap-h">
    <h2 id="roadmap-h">Roadmap</h2>
    <div id="roadmap"></div>
  </section>
</main>
<div id="status" role="status" aria-live="polite" aria-atomic="true" class="sr-only"></div>
<script src="board.js"></script>
<script src="drawer.js"></script>
<script src="live.js"></script>
</body>
</html>
