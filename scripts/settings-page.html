<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="aico-token" content="__AICO_TOKEN__">
<title>aico settings</title>
<style>
:root {
  --bg: #f4f5f7; --surface: #ffffff; --head: #eceef2; --text: #16181d; --muted: #4b5160; --line: #d3d7de;
  --control-border: #6b7280; --accent: #1f4fbf; --accent-hover: #183f9c; --accent-text: #ffffff; --set: #eef3ff;
  --focus: #1f4fbf; --warn-bg: #fff4d6; --warn: #6b4700; --err-bg: #fdecec; --err: #9b1c1c;
  --ok-bg: #e8f5ec; --ok: #17612f; --info-bg: #e9eefb; --info: #2a3a66;
  --shadow: 0 1px 2px rgba(0, 0, 0, .06); --shadow-up: 0 -1px 2px rgba(0, 0, 0, .06);
  --fs-xs: .75rem; --fs-sm: .8125rem; --fs-md: .9375rem; --fs-lg: 1.0625rem; --fs-xl: 1.375rem;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --r1: 4px; --r2: 8px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101216; --surface: #181b21; --head: #20242c; --text: #e8eaf0; --muted: #a1a8b6; --line: #323843;
    --control-border: #8a92a3; --accent: #8aaaff; --accent-hover: #a9c0ff; --accent-text: #0b0f1a; --set: #1c2540;
    --focus: #8aaaff; --warn-bg: #33290f; --warn: #f2cf7a; --err-bg: #3a1b1d; --err: #ffa3a3;
    --ok-bg: #16301f; --ok: #8fdca5; --info-bg: #1d2740; --info: #c3cff0;
    --shadow: none; --shadow-up: none;
  }
}
* { box-sizing: border-box; }
html { scroll-padding-bottom: calc(var(--footer-h, 0px) + 8px); }
body { margin: 0; background: var(--bg); color: var(--text); font: var(--fs-md)/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
header, main { max-width: 1200px; margin: 0 auto; padding: 0 var(--s3); }
@media (min-width: 601px) { header, main { padding: 0 var(--s5); } }
header h1 { font-size: var(--fs-xl); font-weight: 650; line-height: 1.2; margin: var(--s5) 0 var(--s1); }
header p { margin: 0 0 var(--s3); color: var(--muted); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
[role="tablist"] { display: flex; flex-wrap: wrap; gap: 0; border-bottom: 1px solid var(--line); margin: var(--s4) 0 var(--s5); }
[role="tab"] { background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px; color: var(--muted); padding: 0 var(--s4); min-height: 40px; font: inherit; cursor: pointer; white-space: nowrap; flex: none; }
[role="tab"]:hover { color: var(--text); background: var(--head); border-radius: var(--r1) var(--r1) 0 0; }
[role="tab"]:focus-visible { outline-offset: -2px; }
[role="tab"][aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.notice { border-radius: var(--r2); border-left: 4px solid currentColor; padding: var(--s3) var(--s4); margin: 0 0 var(--s3); overflow-wrap: anywhere; font-size: var(--fs-md); }
.notice ul { margin: var(--s1) 0 0; padding-left: 20px; }
.notice.warn { background: var(--warn-bg); color: var(--warn); }
.notice.err { background: var(--err-bg); color: var(--err); }
.notice.info { background: var(--info-bg); color: var(--info); }
.tbox { container-type: inline-size; border: 1px solid var(--line); border-radius: var(--r2); background: var(--surface); box-shadow: var(--shadow); margin-bottom: var(--s5); }
table { border-collapse: separate; border-spacing: 0; width: 100%; }
.vh { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
th, td { text-align: left; padding: var(--s2) var(--s3); border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:last-child > th, tbody tr:last-child > td { border-bottom: 0; }
thead th { background: var(--head); font-size: var(--fs-sm); color: var(--muted); font-weight: 600; }
tr.dept th { background: var(--head); font-size: var(--fs-xs); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
tbody th { font-weight: 500; overflow-wrap: anywhere; }
tbody th[scope="row"] { background: var(--surface); }
td.plugin { color: var(--muted); }
td.effect { font-weight: 600; overflow-wrap: anywhere; }
@media (prefers-reduced-motion: no-preference) {
  tbody tr > td, tbody tr > th[scope="row"], button, [role="tab"] { transition: background-color 100ms; }
}
tbody tr:hover > td, tbody tr:hover > th[scope="row"] { background: var(--head); }
.src { font-weight: 400; color: var(--muted); font-size: var(--fs-sm); margin-left: var(--s1); }
.held { display: block; font-weight: 400; color: var(--warn); font-size: var(--fs-sm); margin-top: 2px; }
.cell { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s1) var(--s2); }
.cell > :first-child { grid-column: 1 / -1; }
.cf { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cf > label { font-size: var(--fs-xs); color: var(--muted); }
.cell select, .cell input[type="text"] { width: 100%; min-width: 0; }
.cf > .hint { margin: 0; overflow-wrap: anywhere; }
select, input[type="text"] { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--control-border); border-radius: var(--r1); padding: 4px 8px; min-height: 32px; }
select:hover:not(:disabled), input[type="text"]:hover:not(:disabled) { border-color: var(--text); }
input[type="text"] { width: 9rem; }
input[type="text"]::placeholder { color: var(--muted); opacity: 1; }
input.wide { width: 100%; max-width: 24rem; }
select:disabled, input:disabled { opacity: .55; cursor: not-allowed; background: var(--head); }
select.set, input.set { border-color: var(--accent); background: var(--set); }
select[aria-invalid="true"], input[aria-invalid="true"] { border: 2px solid var(--err); background: var(--err-bg); }
.lock::after { content: "needs unlock"; margin-left: var(--s2); font-size: var(--fs-sm); font-weight: 400; color: var(--warn); border: 1px solid currentColor; border-radius: 999px; padding: 0 var(--s2); white-space: nowrap; }
.ro { color: var(--muted); font-size: var(--fs-sm); }
.bulk { display: flex; gap: var(--s3); flex-wrap: wrap; align-items: center; margin-bottom: var(--s3); background: var(--head); border-radius: var(--r2); padding: var(--s3); }
.bulk label { display: flex; gap: var(--s1); align-items: center; color: var(--muted); font-size: var(--fs-sm); }
button { font: inherit; border-radius: var(--r1); padding: 0 var(--s4); min-height: 36px; border: 1px solid var(--control-border); background: var(--surface); color: var(--text); cursor: pointer; }
button:hover:not(:disabled) { background: var(--head); }
button:active:not(:disabled) { background: var(--line); }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
button.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
button:disabled { opacity: .55; cursor: not-allowed; }
button.primary:disabled { opacity: 1; background: var(--head); border-color: var(--line); color: var(--muted); }
button.small { min-height: 32px; font-size: var(--fs-sm); }
h2 { font-size: var(--fs-lg); font-weight: 600; line-height: 1.3; margin: var(--s5) 0 var(--s1); }
.hint { color: var(--muted); font-size: var(--fs-sm); line-height: 1.4; margin: 0 0 var(--s3); }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r2); margin-bottom: var(--s2); }
.pcard summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--s1) var(--s3); min-height: 44px; padding: var(--s2) var(--s4) var(--s2) 40px; cursor: pointer; list-style: none; position: relative; border-radius: var(--r2); }
.pcard summary::-webkit-details-marker { display: none; }
.pcard summary::before { content: ""; position: absolute; left: var(--s4); top: 50%; width: 6px; height: 6px; margin-top: -5px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); }
.pcard[open] > summary::before { transform: rotate(45deg); margin-top: -7px; }
.pcard summary:hover { background: var(--head); }
.pcard summary:focus-visible { outline-offset: -2px; }
.pname { font-weight: 600; }
.psum { color: var(--muted); font-size: var(--fs-sm); overflow-wrap: anywhere; }
.pill { font-size: var(--fs-xs); border: 1px solid currentColor; border-radius: 999px; padding: 0 var(--s2); white-space: nowrap; }
.pill.changed { color: var(--accent); }
.pill.refused { color: var(--err); }
.pill.ign { color: var(--warn); }
.pbody { padding: var(--s4); border-top: 1px solid var(--line); }
.pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s5); }
.plevel { border: 0; padding: 0; margin: 0; min-width: 0; }
.plevel legend { width: 100%; padding: 0 0 var(--s1); border-bottom: 1px solid var(--line); font-size: var(--fs-sm); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.plevel > .hint { margin-top: var(--s3); }
.pfield { max-width: 26rem; }
.plabel { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s2); margin: var(--s3) 0 2px; font-size: var(--fs-sm); color: var(--muted); }
.pcount { font-variant-numeric: tabular-nums; }
.pcount.over { color: var(--err); font-weight: 600; }
.pfield input[type="text"], .pfield select { width: 100%; }
.perr { margin: var(--s1) 0 0; color: var(--err); font-size: var(--fs-sm); }
.pfield .hint { margin: var(--s1) 0 0; }
.pfield .hint.held { color: var(--warn); }
.plevel button { margin-top: var(--s3); }
.peff { margin-top: var(--s4); background: var(--head); border-radius: var(--r1); padding: var(--s3); }
.peff h4 { margin: 0 0 var(--s2); font-size: var(--fs-sm); font-weight: 600; color: var(--muted); }
.peff dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px var(--s4); margin: 0; }
.peff dt { color: var(--muted); font-size: var(--fs-sm); }
.peff dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.pfilter { max-width: 26rem; margin-bottom: var(--s3); }
.pfilter label { display: block; font-size: var(--fs-sm); color: var(--muted); margin-bottom: 2px; }
.pfilter input[type="text"] { width: 100%; }
.pfilter .hint { margin: var(--s1) 0 0; }
#pcount { margin: 0 0 var(--s3); color: var(--muted); font-size: var(--fs-sm); }
h3.dept-label { margin: var(--s4) 0 var(--s2); font-size: var(--fs-xs); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
footer { position: sticky; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line); box-shadow: var(--shadow-up); margin-top: var(--s5); }
footer .inner { max-width: 1200px; margin: 0 auto; padding: var(--s3); display: flex; gap: var(--s2); flex-wrap: wrap; align-items: center; }
#count { font-weight: 600; margin-right: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
#count.dirty { color: var(--text); }
#count.dirty::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: var(--s2); }
#status { max-width: 1200px; margin: 0 auto; padding: var(--s3) var(--s3) 0; }
@media (min-width: 601px) { #status { padding: var(--s3) var(--s5) 0; } footer .inner { padding: var(--s3) var(--s5); } }
#status:empty { display: none; }
#status .notice { margin-bottom: 0; }
#status .notice:focus-visible, .sum-title:focus-visible { outline-offset: 2px; }
.sum-title { font-size: var(--fs-md); font-weight: 650; margin: 0; }
.notice a { color: inherit; text-decoration: underline; }
dialog { border: 1px solid var(--line); border-radius: var(--r2); padding: var(--s5); background: var(--surface); color: var(--text); max-width: 440px; width: calc(100% - 32px); box-shadow: 0 10px 30px rgba(0, 0, 0, .25); }
dialog::backdrop { background: rgba(0, 0, 0, .5); }
dialog h2 { margin-top: 0; }
dialog .actions { display: flex; gap: var(--s2); justify-content: flex-end; margin-top: var(--s4); }
[hidden] { display: none !important; }
@media (forced-colors: active) {
  select.set, input.set { border-width: 2px; }
}
/* A table that no longer fits its box becomes a stack of cards; nothing on the page scrolls sideways. */
@container (max-width: 1100px) {
  table.roles, table.roles thead, table.roles tbody, table.roles tr, table.roles th, table.roles td { display: block; }
  table.roles thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  table.roles td::before { content: attr(data-label); display: block; font-size: var(--fs-xs); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 2px; }
  table.roles tr:not(.dept) { border-bottom: 1px solid var(--line); padding: var(--s2) 0; }
  table.roles tbody tr:last-child { border-bottom: 0; }
  table.roles th, table.roles td { border-bottom: 0; padding: var(--s1) var(--s3); }
  table.roles tr:hover > td, table.roles tr:hover > th[scope="row"] { background: transparent; }
}
@container (max-width: 760px) {
  table:not(.roles), table:not(.roles) thead, table:not(.roles) tbody, table:not(.roles) tr, table:not(.roles) th, table:not(.roles) td { display: block; }
  table:not(.roles) thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  table:not(.roles) td::before { content: attr(data-label); display: block; font-size: var(--fs-xs); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 2px; }
  table:not(.roles) tr:not(.dept) { border-bottom: 1px solid var(--line); padding: var(--s2) 0; }
  table:not(.roles) tbody tr:last-child { border-bottom: 0; }
  table:not(.roles) th, table:not(.roles) td { border-bottom: 0; padding: var(--s1) var(--s3); }
  table:not(.roles) tr:hover > td, table:not(.roles) tr:hover > th[scope="row"] { background: transparent; }
  table:not(.roles) input[type="text"], table:not(.roles) select { width: 100%; max-width: 100%; }
}
@media (max-width: 600px), (max-height: 500px) {
  footer { position: static; }
  html { scroll-padding-bottom: 8px; }
  #save { flex: 1 1 100%; }
}
@media (max-width: 600px) {
  .pgrid { grid-template-columns: 1fr; }
  .pfield, input.wide { max-width: none; }
}
</style>
</head>
<body>
<header>
  <h1>aico settings</h1>
  <p>Project wins over User, and both win over the Plugin default. <strong>—</strong> means not set at that level. Changes apply from the next aico run.</p>
</header>
<div id="status" role="status" aria-live="polite"></div>
<div id="field-live" class="vh" role="status" aria-live="polite"></div>
<main>
  <div id="notices" role="status" aria-live="polite"></div>
  <div role="tablist" aria-label="Settings">
    <button role="tab" id="tab-roles" aria-controls="panel-roles" aria-selected="true">Roles</button>
    <button role="tab" id="tab-personality" aria-controls="panel-personality" aria-selected="false" tabindex="-1">Personality</button>
    <button role="tab" id="tab-language" aria-controls="panel-language" aria-selected="false" tabindex="-1">Language &amp; profile</button>
    <button role="tab" id="tab-pipeline" aria-controls="panel-pipeline" aria-selected="false" tabindex="-1">Pipeline</button>
    <button role="tab" id="tab-gates" aria-controls="panel-gates" aria-selected="false" tabindex="-1">Gates</button>
    <button role="tab" id="tab-scan" aria-controls="panel-scan" aria-selected="false" tabindex="-1">Skill scan</button>
    <button role="tab" id="tab-mods" aria-controls="panel-mods" aria-selected="false" tabindex="-1">Mods</button>
  </div>
  <section role="tabpanel" id="panel-roles" aria-labelledby="tab-roles"></section>
  <section role="tabpanel" id="panel-personality" aria-labelledby="tab-personality" hidden></section>
  <section role="tabpanel" id="panel-language" aria-labelledby="tab-language" hidden></section>
  <section role="tabpanel" id="panel-pipeline" aria-labelledby="tab-pipeline" hidden></section>
  <section role="tabpanel" id="panel-gates" aria-labelledby="tab-gates" hidden></section>
  <section role="tabpanel" id="panel-scan" aria-labelledby="tab-scan" hidden></section>
  <section role="tabpanel" id="panel-mods" aria-labelledby="tab-mods" hidden></section>
</main>
<footer>
  <div class="inner">
    <span id="count">0 unsaved changes</span>
    <button type="button" id="clear-user">Clear User on this tab</button>
    <button type="button" id="clear-project">Clear Project on this tab</button>
    <button type="button" id="save" class="primary" disabled>Save</button>
    <button type="button" id="done">Done</button>
  </div>
</footer>
<dialog id="unlock" aria-labelledby="unlock-title">
  <h2 id="unlock-title">Unlock</h2>
  <p id="unlock-text"></p>
  <p class="hint">This adds the unlock to your user settings. Must exceptions and Blocking security findings always ask you.</p>
  <div class="actions">
    <button type="button" id="unlock-cancel">Keep it locked</button>
    <button type="button" id="unlock-ok" class="primary">Unlock</button>
  </div>
</dialog>
<script>
'use strict';
const TOKEN = document.querySelector('meta[name="aico-token"]').content;
const MODELS = ['opus', 'sonnet', 'haiku', 'fable', 'inherit'];
const EFFORTS = ['low', 'medium', 'high', 'xhigh', 'max'];
const LANES = ['security', 'compliance', 'legal', 'persona', 'hands_on', 'accessibility'];
const GATES = ['brief', 'plan', 'ship', 'installs'];
const PROFILE_FIELDS = ['product_type', 'engagement', 'client', 'audience', 'goal', 'stack', 'languages', 'voice', 'license', 'jurisdiction'];
const DEPARTMENTS = [
  ['Product', ['product-manager', 'account-manager']],
  ['Market & tech research', ['market-researcher', 'tech-researcher', 'design-researcher']],
  ['Engineering', ['architect', 'senior-engineer', 'backend-engineer', 'frontend-engineer', 'desktop-engineer', 'ai-data-engineer', 'game-engineer', 'devops']],
  ['Design & art', ['ui-ux-designer', 'brand-artist', 'motion-artist', 'game-artist', 'prompt-artist']],
  ['Quality & security', ['code-reviewer', 'qa', 'security', 'pentester', 'vuln-scanner']],
  ['User research & testing', ['ux-researcher', 'persona-tester', 'hands-on-tester', 'accessibility-tester']],
  ['Content', ['writer', 'marketer', 'localizer']],
  ['Support & legal', ['support', 'legal']]
];
// Lockable settings: the unlock key, what it guards, and the dialog text.
const LOCKS = {
  ship: { title: 'Unlock the Ship Gate', text: 'aico will push the branch and open a PR without asking you. It never merges.' },
  installs: { title: 'Unlock installs', text: 'aico will run design-skill and dependency installs without asking you for approval first.' },
  security: { title: 'Unlock the security lanes', text: 'aico will skip the security and compliance lanes wherever you turn them off. Nobody checks that code for vulnerabilities or legal problems before it ships.' }
};
// Dialog text for the Blast Radius loosening, which the same security unlock covers.
LOCKS.blast = { title: 'Loosen the commit gate', text: 'aico will let commits that touch security paths go ahead with only a warning, or stop checking commits at all. Nobody is asked before such a commit.' };
const MODS = ['savvy', 'cache_tax', 'reflect', 'blast_radius'];
const MOD_LABELS = { savvy: 'Savvy', cache_tax: 'Cache Tax', reflect: 'Reflect', blast_radius: 'Blast Radius' };
const LOCKED_GATES = ['ship', 'installs'];
const LOCKED_LANES = ['security', 'compliance'];
const LANE_LABELS = { security: 'Security', compliance: 'Compliance', legal: 'Legal', persona: 'Persona testing', hands_on: 'Hands-on testing', accessibility: 'Accessibility' };
const GATE_LABELS = { brief: 'Brief', plan: 'Plan', ship: 'Ship', installs: 'Installs' };

let state = null;   // last state from the server
let draft = null;   // { user, project, profile, language: { user, project } }
let syncers = [];   // functions that push draft values into the controls and recompute "In effect"
let activeTab = 'roles';
let filterText = ''; // the Role filter on the Personality tab; never saved or sent
let filterUI = null;
let touched = new Set(); // "level|path" of ignored personality values the user cleared or replaced
const openRoles = new Set(); // Roles whose personality details are open; survives a re-render

// ---------- small helpers ----------
function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k.startsWith('aria-') || k === 'role' || k === 'for' || k === 'list' || k === 'colspan' || k === 'scope' || k === 'href') node.setAttribute(k, String(v));
    else node[k] = v;
  }
  for (const c of children.flat()) if (c !== null && c !== undefined && c !== false) node.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return node;
}
const clone = (v) => (v === undefined ? undefined : JSON.parse(JSON.stringify(v)));
const has = (o, k) => o !== null && typeof o === 'object' && Object.prototype.hasOwnProperty.call(o, k);
function getIn(obj, path) {
  let at = obj;
  for (const p of path) { if (!has(at, p)) return undefined; at = at[p]; }
  return at;
}
// Sets a value; undefined deletes it and prunes objects left empty.
function setIn(obj, path, value) {
  const chain = [obj];
  let at = obj;
  for (const p of path.slice(0, -1)) {
    if (!has(at, p) || typeof at[p] !== 'object') { if (value === undefined) return; at[p] = {}; }
    at = at[p];
    chain.push(at);
  }
  const last = path[path.length - 1];
  if (value === undefined) delete at[last]; else at[last] = value;
  for (let i = path.length - 1; i > 0; i--) {
    if (Object.keys(chain[i]).length === 0) delete chain[i - 1][path[i - 1]]; else break;
  }
}
// Flattens a layer into "path" -> JSON value, unlock entries as "unlocked:<key>".
function flatten(obj, prefix = '', out = {}) {
  for (const [k, v] of Object.entries(obj ?? {})) {

  setIn(draft[rec.level], ['roles', rec.role, 'personality', rec.key], raw.trim() === '' || raw === IGNORED_OPTION ? undefined : raw);
  rec.refused = false;

  refresh();
}

function resetLevel(role, level) {

    if (rec.ignored) touched.add(touchKey(rec));
    setIn(draft[level], ['roles', role, 'personality', rec.key], undefined);
    rec.refused = false;
    rec.sticky = false;
    setError(rec, '');

  refresh();

function personalityField(role, level, key, rule, ignoredPaths, off) {
  const id = `pf-${role}-${level}-${key}`;
  const isText = P_TEXT.includes(key);
  const control = isText
    ? el('input', { type: 'text', id, autocomplete: 'off', placeholder: '-' })
    : el('select', { id });
  const rec = {
    role, level, key, id, isText, control, error: '', refused: false,
    path: `roles.${role}.personality.${key}`,
    errEl: el('p', { class: 'perr', id: `${id}-err`, hidden: true }),
    hintEl: el('p', { class: 'hint', id: `${id}-hint`, hidden: true }),
    countEl: isText && rule ? el('span', { class: 'pcount', id: `${id}-count` }) : null
  };
  rec.ignored = ignoredPaths.has(`${level}|${rec.path}`);
  control.disabled = off;
  if (!isText) {
    control.append(el('option', { value: '' }, 'Not set'));
    for (const l of rule?.levels ?? []) control.append(el('option', { value: l }, capital(l)));
    if (rec.ignored) {
      rec.ignoredOption = el('option', { value: IGNORED_OPTION, disabled: true }, 'Ignored stored value');
      control.append(rec.ignoredOption);

  if (isText) {
    control.addEventListener('input', () => editRecord(rec));
    control.addEventListener('change', () => checkRecord(rec));

  pRecs.push(rec);
  pRoles[role].recs.push(rec);
  return el('div', { class: 'pfield' },
    el('div', { class: 'plabel' }, el('label', { for: id }, P_LABELS[key]), rec.countEl),
    control, rec.errEl, rec.hintEl);
}

function levelFieldset(role, level, rule, ignoredPaths) {
  const off = level === 'project' && !projectOn();
  const box = el('fieldset', { class: 'plevel' }, el('legend', {}, `${roleLabel(role)}, ${levelWord(level)} level`));
  if (level === 'project') box.append(el('p', { class: 'hint' }, PROJECT_HINT));
  for (const key of P_KEYS) box.append(personalityField(role, level, key, rule, ignoredPaths, off));
  const reset = el('button', { type: 'button', class: 'small' }, `Use plugin default for ${role}, ${level}`);

function roleCard(role, rule, ignoredPaths) {

  details.addEventListener('toggle', () => { if (details.open) openRoles.add(role); else openRoles.delete(role); });

  const reg = { role, details, sum: el('span', { class: 'psum' }), eff: el('dl'), recs: [], reset: {},
    pills: { changed: pill('changed', 'changed'), refused: pill('refused', 'refused'), ign: pill('ignored value', 'ign') } };
  pRoles[role] = reg;
  details.append(el('summary', {}, el('span', { class: 'pname' }, role), reg.sum, reg.pills.changed, reg.pills.refused, reg.pills.ign));

const typedValue = (v) => (typeof v === 'string' && v.trim() !== '' ? v.trim() : undefined);
// project, else user, else the plugin default; a typed value that fails its rule does not count yet.
function personalityEffective(role, key) {
  for (const level of ['project', 'user']) {
    const v = getIn(draft[level], ['roles', role, 'personality', key]);
    if (typedValue(v) !== undefined && !fieldProblem(key, v)) return [typedValue(v), level];
  }
  const plugin = state.personalities.roles?.[role]?.plugin;
  return plugin && has(plugin, key) && typeof plugin[key] === 'string' ? [plugin[key], 'plugin'] : [undefined, 'plugin'];
}
const showValue = (key, v) => (P_TEXT.includes(key) ? v : capital(v));

function syncPersonality() {
  const rule = personalityRule();
  for (const rec of pRecs) {
    const c = rec.control;
    const value = draftAt(rec);
    const ignoredNow = ignoredUntouched(rec);
    let want = value === undefined ? '' : String(value);
    if (!rec.isText && ignoredNow) want = IGNORED_OPTION;
    // A text control keeps what is typed while the draft only differs by spaces, so the caret is never moved.
    if (c.value !== want && (!rec.isText || c.value.trim() !== want.trim())) c.value = want;
    c.classList.toggle('set', want !== '' && want !== IGNORED_OPTION);
    if (!ignoredNow && rec.ignoredOption && rec.ignoredOption.parentNode) rec.ignoredOption.remove();
    if (rec.countEl) {
      const n = [...c.value.trim()].length;
      const text = `${n} of ${rule.max} characters`;
      if (rec.countEl.textContent !== text) rec.countEl.textContent = text;
      rec.countEl.classList.toggle('over', n > rule.max);
    }
    if (rec.error && !rec.sticky && !fieldProblem(rec.key, c.value)) setError(rec, '');
    let hint = '';
    if (ignoredNow) hint = rec.isText ? IGNORED_TEXT_HINT : IGNORED_LEVEL_HINT;
    else if (!rec.isText && rule?.phrases) {
      if (want === '') hint = NOT_SET_HINT;
      else if (has(rule.phrases[rec.key], want)) hint = `The Role is told: ${rule.phrases[rec.key][want]}`;
    }
    if (rec.hintEl.textContent !== hint) rec.hintEl.textContent = hint;
    rec.hintEl.hidden = hint === '';
    rec.hintEl.classList.toggle('held', ignoredNow);
    describe(rec);
  }
  for (const reg of Object.values(pRoles)) {
    const eff = P_KEYS.map((key) => [key, ...personalityEffective(reg.role, key)]);
    const parts = eff.filter(([, v]) => v !== undefined).map(([key, v]) => (P_TEXT.includes(key) ? v : `${P_LABELS[key]} ${v}`));
    const sumText = parts.join(', ') || 'nothing set';
    if (reg.sum.textContent !== sumText) reg.sum.textContent = sumText;
    const signature = JSON.stringify(eff);
    if (reg.eff.dataset.signature !== signature) {
      reg.eff.dataset.signature = signature;
      reg.eff.replaceChildren(...eff.flatMap(([key, v, source]) => [
        el('dt', {}, P_LABELS[key]),
        el('dd', {}, v === undefined ? '—' : showValue(key, v), v === undefined ? null : el('span', { class: 'src' }, `(${source})`))
      ]));
    }
    const changed = reg.recs.some((rec) => typedValue(draftAt(rec)) !== getIn(state[rec.level], ['roles', rec.role, 'personality', rec.key])
      || (touched.has(touchKey(rec)) && draftAt(rec) === undefined));
    reg.pills.changed.hidden = !changed;
    reg.pills.refused.hidden = !reg.recs.some((rec) => rec.refused);
    reg.pills.ign.hidden = !(reg.recs.some((rec) => ignoredUntouched(rec)) || reg.objectIgnored);
    for (const level of ['user', 'project']) {
      const here = reg.recs.filter((rec) => rec.level === level);
      reg.reset[level].disabled = (level === 'project' && !projectOn())
        || !here.some((rec) => draftAt(rec) !== undefined || ignoredUntouched(rec));
    }
  }
}

// Hides the cards that do not match; hidden cards keep their drafts and errors and are saved with the rest.
function applyFilter() {

  const q = filterText.trim().toLowerCase();
  const total = Object.keys(pRoles).length;
  let shown = 0;
  for (const reg of Object.values(pRoles)) {
    const name = state.resolved?.roles?.[reg.role]?.name ?? state.plugin?.roles?.[reg.role]?.name ?? '';
    const match = q === '' || [reg.role, name, reg.dept].some((s) => String(s).toLowerCase().includes(q));
    reg.details.hidden = !match;
    if (match) shown++;
  }
  for (const { label, regs } of filterUI.labels) label.hidden = regs.every((r) => r.details.hidden);
  filterUI.count.textContent = shown === 0 ? 'No Role matches the filter.' : `Showing ${shown} of ${total} Roles`;
}
const isIgnoredEntry = (e) => e !== null && typeof e === 'object' && (e.level === 'user' || e.level === 'project')
  && typeof e.path === 'string' && typeof e.reason === 'string';

// Checks every typed value before a Save, so the errors match what a server refusal would show.
function personalityProblems() {
  const bad = [];
  for (const rec of pRecs) {
    if (rec.control.disabled) continue;
    const message = fieldProblem(rec.key, draftAt(rec) ?? '');
    if (!message) continue;
    setError(rec, message);
    rec.refused = true;
    bad.push(rec);
  }

}
const REFUSED_PERSONALITY = /^(user|project) roles\.([a-z0-9-]+)\.personality\.([a-z_]+): /;
// Maps server refusal lines to fields by their leading path. The text comes from the page, never from the line.
function mapRefusals(lines) {
  const rest = [];
  const marked = [];
  const plan = [];
  for (const line of lines) {
    const pm = REFUSED_PLAN_CHECK.exec(line);
    const prec = pm && planRecs.find((r) => r.level === pm[1] && r.key === pm[2]);
    if (prec) {
      prec.sticky = `Error: ${prec.label} ${PLAN_REFUSAL[prec.key]}`;
      prec.stickyValue = prec.control.value;
      prec.message = prec.sticky;
      if (!plan.includes(prec)) plan.push(prec);
      continue;
    }
    const cm = REFUSED_PARALLEL_CAP.exec(line);
    const crec = cm && planRecs.find((r) => r.level === cm[1] && r.key === 'parallel_cap');
    if (crec) {
      crec.sticky = `Error: ${crec.label} ${PARALLEL_CAP_REFUSAL}`;
      crec.stickyValue = crec.control.value;
      if (!plan.includes(crec)) plan.push(crec);
      continue;
    }
    const sm = REFUSED_SHORT_PATH.exec(line);
    const srec = sm && planRecs.find((r) => r.level === sm[1] && r.key === 'short_path');
    if (srec) {
      srec.sticky = `Error: ${srec.label} ${SHORT_PATH_REFUSAL}`;
      srec.stickyValue = srec.control.value;
      if (!plan.includes(srec)) plan.push(srec);
      continue;
    }
    const m = REFUSED_PERSONALITY.exec(line);
    const rec = m && pRecs.find((r) => r.level === m[1] && r.role === m[2] && r.key === m[3]);
    if (!rec) { rest.push(line); continue; }
    const own = fieldProblem(rec.key, draftAt(rec) ?? '');
    setError(rec, own || `Error: ${P_LABELS[rec.key]} was refused. ${rec.isText ? CHARSET_COPY : 'Choose one of the levels, or Not set.'}`);
    rec.sticky = own === '';
    rec.refused = true;
    marked.push(rec);
  }
  return { rest, marked, plan };
}
// "Ava (architect), user level, Way of talking: can't contain a colon. ..."
function refusalText(rec) {

// ---------- Language & profile tab ----------
function renderLanguage(panel) {
  if (!profileOn()) panel.append(el('p', { class: 'notice info' }, 'No .company/project.md here, so the profile and the project language are off. Open the page from a product repo to edit them.'));
  const { wrap, tbody } = table(COLUMNS);
  // Language row: user and project scopes go through language.mjs on save.
  const lang = state.resolved.language;
  const langInput = (scope) => {
    const input = el('input', { type: 'text', placeholder: '—', 'aria-label': `Language, ${scope}` });
    input.disabled = scope === 'project' && !profileOn();
    input.addEventListener('input', () => { draft.language[scope] = input.value; refresh(); });
    syncers.push(() => {
      if (input.value !== draft.language[scope]) input.value = draft.language[scope];
      input.classList.toggle('set', draft.language[scope].trim() !== '');
    });
    return input;
  };
  const langEffect = el('td', { class: 'effect' });
  tbody.append(el('tr', {}, el('th', { scope: 'row' }, 'Language'), el('td', { class: 'plugin' }, 'en'),
    el('td', {}, langInput('user')), el('td', {}, langInput('project')), langEffect));
  syncers.push(() => {
    const changed = changedLanguage();
    // Unchanged: what the server resolved. Changed: project > user > en (plugin default).
    let tag = lang.tag, source = lang.source;
    if (Object.keys(changed).length) {
      const p = draft.language.project.trim(), u = draft.language.user.trim();
      if (p) [tag, source] = [p, 'project'];
      else if (u) [tag, source] = [u, 'user'];

    langEffect.replaceChildren(tag, el('span', { class: 'src' }, `(${source === 'default' ? 'plugin' : source})`));
  });

  const options = state.resolved.profile.options ?? {};
  const stored = state.resolved.profile.fields;
  const datalist = el('datalist', { id: 'voice-options' }, (options.voice ?? []).map((v) => el('option', { value: v })));
  panel.append(datalist);
  for (const field of PROFILE_FIELDS) {
    let control;
    if (field === 'product_type' || field === 'engagement') {
      const opts = [...(options[field] ?? [])];
      if (stored[field] && !opts.includes(stored[field])) opts.unshift(stored[field]);
      control = selectFor(opts, `${field}, project`);
    } else {
      control = el('input', { type: 'text', class: 'wide', maxLength: 200, placeholder: '—', 'aria-label': `${field}, project` });
      if (field === 'voice') control.setAttribute('list', 'voice-options');
    }
    control.disabled = !profileOn();
    control.addEventListener(control.tagName === 'SELECT' ? 'change' : 'input', () => { draft.profile[field] = control.value; refresh(); });
    const effect = el('td', { class: 'effect text' });
    syncers.push(() => {
      const v = draft.profile[field] ?? '';
      if (control.value !== v) control.value = v;
      control.classList.toggle('set', v !== '');
      effect.replaceChildren(v || '—');
    });
    const label = el('th', { scope: 'row' }, field);
    if (field === 'stack') label.append(el('span', { class: 'held' }, 'aico:stack-detect may overwrite this'));
    tbody.append(el('tr', {}, label, el('td', { class: 'plugin' }, '—'), el('td', { class: 'ro' }, 'project only'), el('td', {}, control), effect));
  }
  panel.append(wrap);
  panel.append(el('p', { class: 'hint' }, 'Language takes a BCP 47 tag such as en, nl or pt-BR. Profile fields live in .company/project.md.'));

// Plan check rows: each control has a visible label, the shared hint and, when refused, its own error text.

      err.textContent = message;

  tbody.append(el('tr', {}, el('th', { scope: 'row' }, label), el('td', { class: 'plugin' }, String(pluginValue)), cells, effect));

}
const REFUSED_SHORT_PATH = /^(user|project) pipeline[.]short_path(?![a-z_])/;
const SHORT_PATH_REFUSAL = 'must be on or off.';
const SHORT_PATH_HINT = 'Short path: a feature you approve as low risk at the Brief Gate skips the persona, security, compliance and hands-on lanes and the ruleset research; a fix triaged as low risk skips the security lane. Every Gate and every test stays, and the run goes back to the full route when it touches a risky file. Off: low-risk runs take the full route. A project setting can only turn it off.';
// Short path row: a labelled select per level tied to the hint. The project select offers only off; a stored project "on" stays visible, disabled.

    if (level === 'project' && state.project.pipeline?.short_path === 'on') control.append(el('option', { value: 'on', disabled: true }, 'on'));
    control.id = id;

    syncers.push(() => {

        if (message) live.textContent = prefix + message.replace(/^Error: /, '').replace(`${label} `, '');

      err.textContent = message;
      err.hidden = message === '';
      if (message) { control.setAttribute('aria-invalid', 'true'); control.setAttribute('aria-describedby', `short-path-hint ${err.id}`); }
      else { control.removeAttribute('aria-invalid'); control.setAttribute('aria-describedby', 'short-path-hint'); }

  tbody.append(el('tr', {}, el('th', { scope: 'row' }, label), el('td', { class: 'plugin' }, String(pluginValue)), cells, effect));

const REFUSED_PLAN_CHECK = /^(user|project) plan_check\.(policy|runs)\b/;

// ---------- Gates tab ----------
function renderGates(panel) {

    pipelineRow(tbody, GATE_LABELS[gate], ['gates', gate], defaults[gate], (l) => selectFor(['ask', 'auto'], l), String, String, lock);
  }
  panel.append(wrap);

  panel.append(el('h2', {}, 'Unlocks'));
  const unlocks = table(COLUMNS);
  for (const key of ['ship', 'installs', 'security']) {
    const label = key === 'security' ? 'Security (security and compliance lanes)' : GATE_LABELS[key];
    const sel = el('select', { 'aria-label': `${label} unlock, user` }, el('option', { value: '' }, '— locked'), el('option', { value: 'on' }, 'unlocked'));
    sel.addEventListener('change', async () => {

      setUnlock(key, sel.value === 'on');

    });
    const projectList = state.project.unlocked ?? [];

    const effect = el('td', { class: 'effect' });

      sel.value = on ? 'on' : '';
      sel.classList.toggle('set', on);

    ? el('ul', {}, ignored.map((i) => el('li', {}, i)))
    : el('p', { class: 'hint' }, 'None. Every stored setting applies.'));

// ---------- Skill scan tab ----------
const SCAN_NOTE = "No-LLM: SkillSpector's static rules run on this machine and no skill text leaves it; package names, versions and ecosystems from a skill's dependency files go to OSV.dev for a vulnerability lookup, plus the ids of any vulnerabilities found. Claude CLI: the text of each scanned skill also goes to Claude (Anthropic) under your login and counts toward your usage. Set it for yourself only; a project setting cannot turn it on.";

// ---------- page ----------
function renderNotices() {
  const box = document.getElementById('notices');
  box.replaceChildren();
  if (!projectOn()) box.append(el('p', { class: 'notice info' }, 'No .company/ folder here, so the Project column is off. User settings still save.'));
  const { warnings } = state.resolved;
  const personal = (Array.isArray(state.personalities?.ignored) ? state.personalities.ignored : []).filter(isIgnoredEntry).map((e) => `${e.level} ${e.path}: ${e.reason}`);
  const ignored = [...state.resolved.ignored, ...personal.filter((l) => !state.resolved.ignored.includes(l))];
  if (warnings.length) box.append(el('div', { class: 'notice warn' }, el('strong', {}, 'Warnings'), el('ul', {}, warnings.map((w) => el('li', {}, w)))));
  if (ignored.length) box.append(el('div', { class: 'notice warn' }, el('strong', {}, 'Ignored (stored, but not applied)'), el('ul', {}, ignored.map((w) => el('li', {}, w)))));
}
function render() {
  syncers = [];
  pRecs = [];
  planRecs = [];
  pRoles = {};
  renderNotices();
  const renderers = { roles: renderRoles, personality: renderPersonality, language: renderLanguage, pipeline: renderPipeline, gates: renderGates, scan: renderScan, mods: renderMods };
  for (const [name, fn] of Object.entries(renderers)) {
    const panel = document.getElementById(`panel-${name}`);
    panel.replaceChildren();
    fn(panel);
    labelCells(panel);
  }
  document.getElementById('clear-project').disabled = !projectOn();
  refresh();
}
function refresh() {
  for (const s of syncers) s();
  const n = unsavedCount();
  const count = document.getElementById('count');
  count.textContent = `${n} unsaved ${n === 1 ? 'change' : 'changes'}`;
  count.classList.toggle('dirty', n > 0);
  document.getElementById('save').disabled = n === 0;
}
function status(kind, title, lines = []) {
  const box = document.getElementById('status');
  box.replaceChildren();
  if (!title) return null;
  const message = el('div', { class: `notice ${kind}`, id: 'status-message', tabIndex: -1 }, title, lines.length ? el('ul', {}, lines.map((l) => el('li', {}, l))) : null);
  box.append(message);
  return message;
}
// A control the user can reach now: not hidden, not in a hidden panel, not in a closed card, and enabled.
function isShown(node) {
  for (let n = node; n; n = n.parentNode) {
    if (n.hidden) return false;
    if (n.tagName === 'DETAILS' && !n.open && n !== node) return false;
  }
  return !node.disabled;
}
// After a rebuild: the control with the same id when it still works, else the status message.
function restoreFocus(previousId, message) {
  const same = previousId ? document.getElementById(previousId) : null;
  if (same && isShown(same)) same.focus(); else if (message) message.focus();
}
function load(newState) {
  state = newState;
  resetDraft();
  render();
}

async function api(path, body) {
  const init = { headers: { 'X-Aico-Token': TOKEN }, cache: 'no-store' };
  if (body !== undefined) {
    init.method = 'POST';
    init.headers['Content-Type'] = 'application/json';
    init.body = JSON.stringify(body);
  }
  const res = await fetch(path, init);
  let data = {};
  try { data = await res.json(); } catch { /* empty or not JSON */ }
  return { status: res.status, data };
}
const unreachable = () => status('err', 'Can\'t reach the settings server. It stops after 30 minutes idle or when you press Done; run /aico:settings again.');

async function save() {
  const previousId = document.activeElement?.id ?? '';
  const bad = personalityProblems();
  refresh();
  const badPlan = planProblems();
  if (bad.length || badPlan.length) {
    refusedStatus(bad, [], badPlan);
    return;
  }
  const body = { revision: state.resolved.revision };
  if (levelChanges('user')) body.user = outgoing('user');
  if (projectOn() && levelChanges('project')) body.project = outgoing('project');
  const profile = changedProfile();
  if (profileOn() && Object.keys(profile).length) body.profile = profile;
  const language = changedLanguage();
  if (Object.keys(language).length) body.language = language;
  const button = document.getElementById('save');
  button.disabled = true;
  let res;
  try {
    res = await api('/api/save', body);
  } catch {
    unreachable();
    refresh();
    return;
  }
  if (res.status === 200 && res.data.state) {
    load(res.data.state);
    restoreFocus(previousId, status('info', 'Saved. Changes apply from the next aico run.'));
  } else if (res.status === 409 && res.data.state) {
    load(res.data.state);
    restoreFocus(previousId, status('err', 'Your view was stale: the settings changed somewhere else since this page loaded. The page now shows the current values, and your edits were not saved. Make them again and press Save.'));
  } else {
    refresh();
    const { rest, marked, plan } = mapRefusals(res.data.refused ?? [`the server answered ${res.status}`]);
    refresh();
    refusedStatus(marked, rest, plan);
  }
}

// The Roles tab clears every Role key except personality; the Personality tab clears only personality.
function clearRoles(level) {
  for (const [role, entry] of Object.entries(draft[level].roles ?? {})) {
    for (const key of Object.keys(entry)) if (key !== 'personality') delete entry[key];
    if (Object.keys(entry).length === 0) delete draft[level].roles[role];
  }
  if (draft[level].roles && Object.keys(draft[level].roles).length === 0) delete draft[level].roles;
}
function clearPersonality(level) {
  touchIgnored(level);
  for (const [role, entry] of Object.entries(draft[level].roles ?? {})) {
    delete entry.personality;
    if (Object.keys(entry).length === 0) delete draft[level].roles[role];
  }
  if (draft[level].roles && Object.keys(draft[level].roles).length === 0) delete draft[level].roles;
}
function clearLevel(level) {
  if (activeTab === 'roles') clearRoles(level);
  else if (activeTab === 'personality') clearPersonality(level);
  else if (activeTab === 'pipeline') { delete draft[level].pipeline; delete draft[level].reprompt; delete draft[level].plan_check; }
  else if (activeTab === 'mods') delete draft[level].mods;
  else if (activeTab === 'scan') delete draft[level].skillspector;
  else if (activeTab === 'gates') { delete draft[level].gates; if (level === 'user') delete draft.user.unlocked; }
  else if (activeTab === 'language') {
    draft.language[level] = '';
    if (level === 'project') status('info', 'Profile fields can\'t be cleared, only changed. The project language is cleared.');
  }
  refresh();
}

async function done() {
  if (unsavedCount() > 0 && !window.confirm('You have unsaved changes. Close without saving?')) return;
  try {
    await api('/api/done', {});
  } catch { /* the server may already be gone */ }
  draft = null;
  status('', '');
  const stopped = el('p', { class: 'notice info', id: 'stopped', tabIndex: -1 }, 'Settings server stopped. You can close this tab.');
  document.querySelector('main').replaceChildren(stopped);
  document.querySelector('footer').hidden = true;
  stopped.focus();
}

function selectTab(name, focus = false) {
  activeTab = name;
  for (const tab of document.querySelectorAll('[role="tab"]')) {
    const on = tab.id === `tab-${name}`;
    tab.setAttribute('aria-selected', String(on));
    tab.tabIndex = on ? 0 : -1;
    document.getElementById(tab.getAttribute('aria-controls')).hidden = !on;
    if (on && focus) tab.focus();
  }
}
const TAB_NAMES = ['roles', 'personality', 'language', 'pipeline', 'gates', 'scan', 'mods'];
for (const tab of document.querySelectorAll('[role="tab"]')) {
  tab.addEventListener('click', () => selectTab(tab.id.slice(4)));
  tab.addEventListener('keydown', (e) => {
    const i = TAB_NAMES.indexOf(activeTab);
    const next = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: TAB_NAMES.length - 1 }[e.key];
    if (next === undefined) return;
    e.preventDefault();
    selectTab(TAB_NAMES[(next + TAB_NAMES.length) % TAB_NAMES.length], true);
  });
}
// Keeps the footer height in a CSS variable so scroll-padding-bottom clears it.
const footerEl = document.querySelector('footer');
const syncFooterHeight = () => document.documentElement.style.setProperty('--footer-h', `${footerEl.hidden ? 0 : Math.ceil(footerEl.getBoundingClientRect().height)}px`);
syncFooterHeight();
if (typeof ResizeObserver === 'function') new ResizeObserver(syncFooterHeight).observe(footerEl);
document.getElementById('save').addEventListener('click', save);
document.getElementById('done').addEventListener('click', done);
document.getElementById('clear-user').addEventListener('click', () => clearLevel('user'));
document.getElementById('clear-project').addEventListener('click', () => clearLevel('project'));
window.addEventListener('beforeunload', (e) => { if (draft && unsavedCount() > 0) e.preventDefault(); });

(async () => {
  try {
    const res = await api('/api/state');
    if (res.status !== 200) { status('err', 'The server refused to load settings:', res.data.refused ?? [String(res.status)]); return; }
    load(res.data);
  } catch {
    unreachable();
  }
})();
