name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Deterministic, zero-token structural checks: frontmatter, names, broken
      # aico: references, size budgets and version consistency across files.
      - run: npm test
      - run: npm run check
